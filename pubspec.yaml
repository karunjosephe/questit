name: questit
description: "Questit - Gamify your daily focus."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.6.0
  flutter_foreground_task: ^10.0.0
  wakelock_plus: ^1.7.0
  vibration: ^3.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  # Added the launcher icons package here!
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# --- ADDED LAUNCHER ICONS CONFIGURATION ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # This tells Android to fill the edges and empty space with black
  adaptive_icon_background: "#000000"
  # This tells Android what image to place on top of that background
  adaptive_icon_foreground: "assets/icon/app_icon.png"